# Vision Detect — Basic edition, bitta domen: https://vision.example.uz
#   /            → dashboard (statik fayllar, Node server kerak emas)
#   /api/...     → API (dashboard so'rovlari; /api prefiksi olib tashlanadi)
#   /v1, /cdn, /media → API (vidjet, server webhooklari, rasmlar)
# O'rnatish: sudo cp nginx.conf /etc/nginx/sites-available/vision && sudo ln -s ../sites-available/vision /etc/nginx/sites-enabled/
#            sudo certbot --nginx -d vision.example.uz      (HTTPS — majburiy: cookie Secure, mijoz saytlari HTTPS)

server {
    listen 80;
    server_name vision.example.uz;

    root /opt/vision-basic/apps/dashboard/out;
    index index.html;
    client_max_body_size 12m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location ~ ^/(v1|cdn|media|healthz|readyz)/? {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Next.js statik resurslari — o'zgarmas (hash'li) fayllar
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }
}
