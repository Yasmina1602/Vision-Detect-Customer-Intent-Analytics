[project]
name = "vision-detect-api"
version = "2.0.0"
requires-python = ">=3.10"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.32.1",
  "sqlalchemy[asyncio]==2.0.36",
  "aiomysql==0.2.0",
  "pymysql==1.1.1",
  "alembic==1.14.0",
  "pydantic==2.10.3",
  "pydantic-settings==2.6.1",
  "email-validator==2.2.0",
  "argon2-cffi==23.1.0",
  "pyjwt==2.10.1",
  "python-multipart==0.0.19",
  "pillow==11.0.0",
  "httpx==0.28.1",
  "google-genai==0.3.0",
  "cryptography==44.0.0",
  "tzdata==2024.2",
]

[project.optional-dependencies]
redis = ["redis==5.2.1"]
dev = ["pytest==8.3.4", "pytest-asyncio==0.24.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
