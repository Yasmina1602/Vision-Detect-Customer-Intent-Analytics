<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rahmat! — Demo Shop</title>
  <style>
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:#f8fafc; font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:#0f172a; padding:16px; }
    .box { background:#fff; border:1px solid #e5e7eb; border-radius:20px; padding:36px 28px; max-width:440px; text-align:center; }
    .ok { width:64px; height:64px; border-radius:50%; background:#dcfce7; color:#16a34a; display:grid; place-items:center; margin:0 auto 16px; font-size:32px; }
    a { color:#0f766e; font-weight:600; }
  </style>
</head>
<body>
  <div class="box">
    <div class="ok">✓</div>
    <h1 style="margin:0 0 8px;font-size:22px">Buyurtmangiz qabul qilindi</h1>
    <p id="o" style="color:#64748b"></p>
    <p style="font-size:14px;color:#64748b">"Rahmat" sahifasida loader <code>PURCHASE</code> hodisasini zaxira sifatida yuboradi
      (asosiy manba — server webhook).</p>
    <a href="/demo/vanilla">← Do'konga qaytish</a>
  </div>
  <script>document.getElementById("o").textContent = "Buyurtma raqami: " + (new URLSearchParams(location.search).get("order") || "—");</script>
  <script src="{{API}}/cdn/v1/loader.js" data-key="{{PK}}" async></script>
</body>
</html>
